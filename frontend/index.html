<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/movena-mark.png" />
    <link rel="apple-touch-icon" href="/movena-mark.png" />
    <link rel="preload" href="/InterVariable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071b4a" />
    <meta name="description" content="Movena turns exercise video into clear, educational movement insights and visual reports." />
    <meta name="application-name" content="Movena" />
    <script>
      (() => {
        const saved = localStorage.getItem("movena_theme");
        const theme = saved === "light" || saved === "dark"
          ? saved
          : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <title>Movena</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

name: Retire old PhysioVision AWS stack

on:
  workflow_dispatch:
    inputs:
      execute:
        description: Delete the old stack after retaining a final database snapshot
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: physiovision-staging-retirement
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  ENVIRONMENT: staging
  LEGACY_INFRA_COMMIT: 3259ecd33b623d19099777e2af02012e5783ca3b

jobs:
  retire:
    name: Retire old PhysioVision staging
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.LEGACY_INFRA_COMMIT }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: physiovision-retire-${{ github.run_id }}
          role-duration-seconds: 7200
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.8"
      - name: Initialize old Terraform state
        run: >-
          terraform -chdir=infra/aws init -reconfigure
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=physiovision/staging/terraform.tfstate"
          -backend-config="region=${{ env.AWS_REGION }}"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"
      - name: Inventory old stack
        run: |
          terraform -chdir=infra/aws state list
          terraform -chdir=infra/aws plan -destroy \
            -var="aws_region=${AWS_REGION}" \
            -var="environment=${ENVIRONMENT}" \
            -var="app_version=retired" \
            -var="app_secret_arn=${{ vars.APP_SECRET_ARN }}" \
            -var="protect_data=false"
      - name: Retain final database snapshot
        if: ${{ inputs.execute }}
        shell: bash
        run: |
          database=$(terraform -chdir=infra/aws output -raw rds_instance_identifier)
          snapshot="physiovision-staging-final-${GITHUB_RUN_ID}"
          aws rds create-db-snapshot --db-instance-identifier "$database" --db-snapshot-identifier "$snapshot" >/dev/null
          aws rds wait db-snapshot-available --db-snapshot-identifier "$snapshot"
          echo "Retained RDS snapshot: $snapshot"
      - name: Disable old resource deletion protection
        if: ${{ inputs.execute }}
        run: >-
          terraform -chdir=infra/aws apply -auto-approve
          -target=aws_db_instance.database
          -target=aws_lb.backend
          -var="aws_region=${AWS_REGION}"
          -var="environment=${ENVIRONMENT}"
          -var="app_version=retired"
          -var="app_secret_arn=${{ vars.APP_SECRET_ARN }}"
          -var="protect_data=false"
      - name: Empty versioned frontend bucket and container registry
        if: ${{ inputs.execute }}
        shell: bash
        run: |
          bucket=$(terraform -chdir=infra/aws output -raw frontend_bucket)
          repository_url=$(terraform -chdir=infra/aws output -raw ecr_repository_url)
          repository="${repository_url#*/}"

          while true; do
            versions=$(aws s3api list-object-versions --bucket "$bucket" --max-items 1000)
            delete_payload=$(jq -c '{Objects: ([.Versions[]?, .DeleteMarkers[]?] | map({Key: .Key, VersionId: .VersionId})), Quiet: true}' <<<"$versions")
            count=$(jq '.Objects | length' <<<"$delete_payload")
            if [ "$count" -eq 0 ]; then
              break
            fi
            aws s3api delete-objects --bucket "$bucket" --delete "$delete_payload" >/dev/null
          done

          images=$(aws ecr list-images --repository-name "$repository" --query 'imageIds' --output json)
          if [ "$(jq 'length' <<<"$images")" -gt 0 ]; then
            aws ecr batch-delete-image --repository-name "$repository" --image-ids "$images" >/dev/null
          fi
      - name: Destroy old PhysioVision stack
        if: ${{ inputs.execute }}
        run: >-
          terraform -chdir=infra/aws destroy -auto-approve
          -var="aws_region=${AWS_REGION}"
          -var="environment=${ENVIRONMENT}"
          -var="app_version=retired"
          -var="app_secret_arn=${{ vars.APP_SECRET_ARN }}"
          -var="protect_data=false"
      - name: Verify old state is empty
        if: ${{ inputs.execute }}
        shell: bash
        run: test -z "$(terraform -chdir=infra/aws state list)"

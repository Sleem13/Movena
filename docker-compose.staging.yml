services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${STAGING_BACKEND_PORT:-8010}:8000"
    environment:
      APP_ENV: staging
      APP_VERSION: ${APP_VERSION:-0.28.0}
      DATABASE_URL: ${DATABASE_URL:?Set a managed PostgreSQL DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY:?Set a non-default SECRET_KEY of at least 32 characters}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set the exact HTTPS staging web origin}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-100}
      ALLOWED_VIDEO_EXTENSIONS: ${ALLOWED_VIDEO_EXTENSIONS:-.mp4,.mov,.avi,.mkv,.webm}
      ARTIFACT_RETENTION_HOURS: ${ARTIFACT_RETENTION_HOURS:-24}
      ENABLE_SESSION_HISTORY: ${ENABLE_SESSION_HISTORY:-true}
      ENABLE_THERAPIST_DASHBOARD: ${ENABLE_THERAPIST_DASHBOARD:-true}
      ENABLE_ML_SECOND_OPINION: "false"
      ENABLE_REPORT_GENERATION: ${ENABLE_REPORT_GENERATION:-true}
      ENABLE_OVERLAY_GENERATION: ${ENABLE_OVERLAY_GENERATION:-true}
      ENABLE_PUBLIC_DEMO_MODE: "false"
      REQUIRE_AUTH_FOR_ANALYSIS: "true"
    volumes:
      - staging_artifacts:/app/backend/artifacts
    restart: unless-stopped

volumes:
  staging_artifacts:

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      DATABASE_URL: sqlite:////app/backend/data/physiovision_dev.db
      APP_VERSION: 0.12.0
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000
      ARTIFACT_RETENTION_HOURS: 24
    volumes:
      - ./backend/artifacts:/app/backend/artifacts
      - physiovision_data:/app/backend/data
    restart: unless-stopped

volumes:
  physiovision_data:

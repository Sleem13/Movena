services:
  - type: web
    name: physiovision-api
    runtime: python
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python -m uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: APP_ENV
        value: staging
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: REQUIRE_AUTH_FOR_ANALYSIS
        value: "true"
      - key: ENABLE_PUBLIC_DEMO_MODE
        value: "false"
      - key: ENABLE_ML_SECOND_OPINION
        value: "false"
      - key: ENABLE_EXERCISE_RECOGNITION
        value: "false"
